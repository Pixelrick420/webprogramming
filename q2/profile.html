<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>John Doe</title>
        <link rel="stylesheet" href="profile.css" />
    </head>

    <body>
        <div id="card-container" class="profile-card">
            <span class="badge">Pro Member</span>

            <div class="image-wrapper">
                <img
                    src="profile.jpg"
                    alt="Profile"
                    class="profile-img"
                />
                <span class="decorative-icon">&#9733;</span>
            </div>

            <div class="profile-info">
                <h2>John Doe</h2>
                <p class="bio">
                    Full-Stack Developer &amp; Open Source enthusiast.
                    Passionate about building clean, scalable web applications
                    and delightful user experiences.
                </p>
            </div>
        </div>
    </body>
</html>
